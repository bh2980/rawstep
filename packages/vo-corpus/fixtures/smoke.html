<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vo-corpus smoke</title>
</head>
<body>
  <!-- Every name is unique so the speech alone says where the VoiceOver cursor is. -->
  <button type="button" autofocus>Start marker</button>
  <h1>Smoke heading one</h1>
  <p>Plain paragraph text.</p>
  <a href="#nowhere">Plain link</a>
  <button type="button" aria-pressed="true">Mute</button>
  <label><input type="checkbox"> Agree</label>
  <button type="button" aria-expanded="false">More details</button>
  <h2>Smoke heading two</h2>
  <label>Email <input type="email" required></label>
  <label>Notes <textarea></textarea></label>
  <h3>Smoke heading three</h3>
  <button type="button">End marker</button>
</body>
</html>
