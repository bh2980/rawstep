<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settings | PhoneShop</title></head>
<body>
<header><nav aria-label="Main"><ul><li><a href="#">Home</a></li><li><a href="#">Shop</a></li><li><a href="#">Account</a></li></ul></nav></header>
<main>
  <h1>Account settings</h1>
  <h2>Profile</h2>
  <p>Name: Alex Kim</p>
  <p>Email: alex@example.com</p>
  <a href="#">Edit profile</a>
  <h2>Notifications</h2>
  <form id="notifications">
    <fieldset>
      <legend>Email notifications</legend>
      <label><input type="checkbox" name="news"> Newsletter</label>
      <label><input type="checkbox" name="orders"> Order updates</label>
      <label><input type="checkbox" name="offers"> Special offers</label>
    </fieldset>
    <button type="submit">Save changes</button>
  </form>
  <p id="status" role="status"></p>
  <h2>Privacy</h2>
  <a href="#">Download my data</a>
</main>
<script>
document.getElementById('notifications').addEventListener('submit', event => {
  event.preventDefault();
  const orders = event.target.elements.orders.checked;
  document.getElementById('status').textContent = orders ? 'Settings saved. Order updates are on.' : 'Settings saved.';
});
</script>
</body>
</html>
