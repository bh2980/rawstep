<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple CTA Fixture</title>
    <style>
      body {
        font-family: Georgia, serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7efe6, #e6d7c3);
        color: #2b2116;
      }
      main {
        width: min(720px, calc(100vw - 48px));
        padding: 40px;
        background: rgba(255, 252, 248, 0.92);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(66, 42, 20, 0.12);
      }
      a, button {
        font: inherit;
      }
      button {
        margin-top: 20px;
        border: none;
        padding: 14px 22px;
        border-radius: 999px;
        background: #9d4f24;
        color: white;
      }
      :focus-visible {
        outline: 4px solid #116466;
        outline-offset: 4px;
      }
      #result[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>Move with keyboard only and activate the call to action.</p>
      <a href="#about">About</a>
      <div>
        <button id="cta" type="button">Get started</button>
      </div>
      <p id="result" hidden>Started!</p>
    </main>
    <script>
      const button = document.getElementById("cta");
      const result = document.getElementById("result");
      button.addEventListener("click", () => {
        result.hidden = false;
        document.title = "Simple CTA Completed";
      });
    </script>
  </body>
</html>
