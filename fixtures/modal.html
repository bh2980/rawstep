<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal Fixture</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, serif;
        background:
          radial-gradient(circle at top right, rgba(62, 116, 155, 0.24), transparent 32%),
          linear-gradient(180deg, #e7f0f5, #f7f0e6);
      }
      main {
        width: min(720px, calc(100vw - 48px));
        padding: 40px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 26px;
        box-shadow: 0 20px 50px rgba(26, 47, 63, 0.14);
      }
      button {
        font: inherit;
        padding: 12px 18px;
        border-radius: 999px;
        border: none;
        background: #245a73;
        color: white;
      }
      dialog {
        border: none;
        border-radius: 24px;
        padding: 24px;
        width: min(440px, calc(100vw - 64px));
      }
      :focus-visible {
        outline: 4px solid #d86e1f;
        outline-offset: 4px;
      }
      #status {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dialog demo</h1>
      <p>Open the dialog and close it without confirming.</p>
      <button id="open" type="button">Open dialog</button>
      <p id="status">Dialog closed.</p>
      <dialog id="dialog" aria-labelledby="dialog-title">
        <h2 id="dialog-title">Confirm action</h2>
        <p>Choose confirm or cancel, or press Escape.</p>
        <button id="confirm" type="button">Confirm</button>
        <button id="cancel" type="button">Cancel</button>
      </dialog>
    </main>
    <script>
      const openButton = document.getElementById("open");
      const dialog = document.getElementById("dialog");
      const status = document.getElementById("status");
      const cancel = document.getElementById("cancel");
      const confirm = document.getElementById("confirm");

      function setClosedState() {
        document.title = "Modal Fixture (Dialog Closed)";
        status.textContent = "Dialog closed and focus returned.";
        openButton.focus();
      }

      openButton.addEventListener("click", () => {
        dialog.showModal();
        document.title = "Modal Fixture (Dialog Open)";
        status.textContent = "Dialog is open.";
      });

      dialog.addEventListener("close", () => {
        setClosedState();
      });

      cancel.addEventListener("click", () => dialog.close("cancel"));
      confirm.addEventListener("click", () => dialog.close("confirm"));

      document.title = "Modal Fixture";
    </script>
  </body>
</html>
