<!doctype html><html lang="en"><meta charset="utf-8"><title>Screenshot workflow: ready</title>
<style>body{font:26px system-ui,sans-serif;margin:70px;background:#f4f6fa;color:#172239;max-width:850px}button{font:700 28px system-ui;padding:24px 35px;background:#fff;color:#172239;border:3px solid #203f67;border-radius:10px}button:focus{outline:8px solid #ef6400;outline-offset:8px}p{line-height:1.6}.status{font-weight:700;margin-top:35px}</style>
<h1>Two-stage keyboard workflow</h1><p>This easy wiring-check fixture naturally autofocuses its only button. It is not a navigation accuracy test.</p>
<button id="advance" autofocus>Begin workflow</button><p id="status" class="status" role="status">Ready to begin</p>
<script>let stage=0;const button=document.getElementById('advance');button.onclick=()=>{stage++;if(stage===1){button.textContent='Complete workflow';document.getElementById('status').textContent='Workflow started. Activate Complete workflow to finish.';document.title='Screenshot workflow: started'}else{button.textContent='Workflow completed';document.getElementById('status').textContent='Both keyboard stages completed';document.title='Screenshot workflow: completed';button.disabled=true}};</script></html>
