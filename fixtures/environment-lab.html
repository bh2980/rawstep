<!doctype html><html lang="en"><meta charset="utf-8"><title>Environment accessibility lab</title><style>
*{box-sizing:border-box}body{font:20px/1.3 system-ui;background:#fff;color:#111;margin:24px}.skip{position:absolute;left:-9999px}.skip:focus{left:24px;top:8px;background:white;padding:10px;z-index:10}:focus-visible{outline:4px solid #f60;outline-offset:4px}button,input,a{font:inherit;margin:12px;padding:12px}main{max-width:900px}.row{display:flex;flex-wrap:wrap;gap:12px}.clip{width:220px;height:32px;overflow:hidden}.wide{width:380px}.ticker{animation:pulse 1s infinite}dialog{max-width:80vw}label{display:block}.error{color:#b00}@media(prefers-reduced-motion:reduce){.ticker{animation:none}}@media(forced-colors:active){button{border:3px solid ButtonText}}@media(prefers-contrast:more){body{font-weight:700}}@keyframes pulse{50%{opacity:.7}}
</style><a class="skip" href="#main">Skip to main content</a><header><h1>Environment accessibility lab</h1><p>Keyboard, text enlargement, reflow and media settings</p></header><main id="main" tabindex="-1"><div class="row"><button id="open">Open settings</button><button id="finish">Finish task</button></div><p id="status" role="status">Ready</p><p class="clip">This deliberately clipped sentence expands beyond its fixed-height container.</p><div class="wide">Deliberately fixed-width region for narrow-viewport observations</div><p class="ticker">Motion preference sample</p><form id="form" novalidate><label>Email <input id="email" type="email" aria-describedby="error"></label><span id="error"></span><button>Continue</button></form></main><dialog id="settings"><h2>Settings</h2><label><input type="checkbox">Enable notifications</label><button id="close">Close settings</button></dialog><script>
const dialog=document.getElementById('settings');document.getElementById('open').onclick=()=>dialog.showModal();document.getElementById('close').onclick=()=>dialog.close();document.getElementById('finish').onclick=()=>document.getElementById('status').textContent='Task completed successfully';document.getElementById('form').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email'),error=document.getElementById('error');if(!email.value.includes('@')){email.setAttribute('aria-invalid','true');error.textContent='Enter a valid email address';error.setAttribute('role','alert');email.focus()}else{email.removeAttribute('aria-invalid');error.textContent='';document.getElementById('status').textContent='Form recovered successfully'}};
</script></html>
