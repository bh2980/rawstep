<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Credential Login Fixture</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f6eee6, #dde6f0);
        color: #1f2430;
        font-family: Georgia, serif;
      }
      main {
        width: min(720px, calc(100vw - 40px));
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 60px rgba(31, 36, 48, 0.12);
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }
      input {
        padding: 12px 14px;
        border: 1px solid rgba(31, 36, 48, 0.18);
        border-radius: 14px;
        font: inherit;
      }
      button {
        width: fit-content;
        padding: 12px 18px;
        border: none;
        border-radius: 999px;
        background: #245c86;
        color: white;
        font: inherit;
      }
      :focus-visible {
        outline: 4px solid #d1682a;
        outline-offset: 4px;
      }
      #success[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in with credentials</h1>
      <p>Fill both named inputs and submit the form.</p>
      <form id="login-form">
        <label for="email">
          Work email
          <input id="email" name="email" type="email" autocomplete="email" />
        </label>
        <label for="password">
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </label>
        <button id="submit" type="submit">Sign in</button>
      </form>
      <p id="success" hidden>Signed in.</p>
    </main>
    <script>
      const form = document.getElementById("login-form");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const success = document.getElementById("success");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!email.value.trim() || !password.value.trim()) {
          return;
        }
        success.hidden = false;
        document.title = "Credential Login Completed";
      });
    </script>
  </body>
</html>
