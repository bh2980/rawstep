<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Credential Login Fixture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: sans-serif; padding: 32px; }
      form { display: grid; gap: 12px; max-width: 420px; }
      .error { margin-top: 4px; color: #b42318; font-weight: 700; }
      .status { margin-top: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Credential Login Fixture</h1>
    <form id="credential-form" novalidate>
      <label>
        Email
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          aria-errormessage="credential-email-error"
          required
        />
      </label>
      <div id="credential-email-error" class="error" role="alert" aria-atomic="true" hidden></div>
      <label>
        Password
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          aria-errormessage="credential-password-error"
          required
        />
      </label>
      <div id="credential-password-error" class="error" role="alert" aria-atomic="true" hidden></div>
      <button id="submit" type="submit">Sign in</button>
    </form>
    <div id="status" class="status" hidden aria-live="polite"></div>
    <script>
      const form = document.getElementById("credential-form");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const emailError = document.getElementById("credential-email-error");
      const passwordError = document.getElementById("credential-password-error");
      const status = document.getElementById("status");
      const defaultTitle = document.title;

      function clearSuccess() {
        status.hidden = true;
        status.textContent = "";
      }

      function clearFieldError(field, errorNode) {
        field.removeAttribute("aria-invalid");
        errorNode.hidden = true;
        errorNode.textContent = "";
      }

      function showFieldError(field, errorNode, message) {
        field.setAttribute("aria-invalid", "true");
        errorNode.hidden = false;
        errorNode.textContent = message;
      }

      function validateForm() {
        email.value = email.value.trim();
        password.value = password.value.trim();
        clearFieldError(email, emailError);
        clearFieldError(password, passwordError);

        let valid = true;

        if (!email.checkValidity()) {
          valid = false;
          showFieldError(
            email,
            emailError,
            email.validity.valueMissing
              ? "Enter your email address before signing in."
              : "Enter a valid email address like name@example.com."
          );
        }

        if (!password.checkValidity()) {
          valid = false;
          showFieldError(password, passwordError, "Enter your password before signing in.");
        }

        if (!valid) {
          clearSuccess();
          document.title = defaultTitle;
        }

        return valid;
      }

      email.addEventListener("input", () => {
        clearFieldError(email, emailError);
        clearSuccess();
        document.title = defaultTitle;
      });

      password.addEventListener("input", () => {
        clearFieldError(password, passwordError);
        clearSuccess();
        document.title = defaultTitle;
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!validateForm()) {
          const firstInvalid = form.querySelector("[aria-invalid='true']");
          if (firstInvalid instanceof HTMLElement) {
            firstInvalid.focus();
          }
          return;
        }

        document.title = "Credential Login Completed";
        status.hidden = false;
        status.textContent = "Signed in.";
      });
    </script>
  </body>
</html>
